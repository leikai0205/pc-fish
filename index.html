<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Fish 養魚全能數據資料庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ocean: { 800: '#0f172a', 900: '#0b1120', 700: '#1e293b', accent: '#38bdf8', gold: '#f59e0b' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-ocean-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <header class="bg-ocean-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid font-bold text-2xl text-cyan-400 fa-fish"></i>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
            PC Fish 養魚全能數據資料庫
          </h1>
          <p class="text-xs text-slate-400">繁殖防呆預測 • 10隻魚合成與賽季配方</p>
        </div>
      </div>
    </div>
    <div class="max-w-7xl mx-auto px-4 flex space-x-2 border-t border-slate-700/50 pt-2">
      <button id="nav-breed" onclick="switchTab('tab-breed')" class="nav-btn px-4 py-2 text-sm font-semibold rounded-t-lg transition-all flex items-center gap-2 border-b-2 border-cyan-400 text-cyan-400 bg-slate-800/80">
        <i class="fa-solid fa-heart"></i> 繁殖計算器
      </button>
      <button id="nav-synth" onclick="switchTab('tab-synth')" class="nav-btn px-4 py-2 text-sm font-semibold rounded-t-lg transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200 border-b-2 border-transparent">
        <i class="fa-solid fa-wand-magic-sparkles"></i> 10隻魚合成與賽季配方
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
    <!-- TAB 1: BREEDING -->
    <div id="tab-breed" class="tab-content space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Forward Breeding -->
        <div class="bg-ocean-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-cyan-400 flex items-center gap-2">
              <i class="fa-solid fa-dna"></i> 正向雙親繁殖預測
            </h2>
            <span class="text-xs bg-cyan-950 text-cyan-300 px-2.5 py-1 rounded-full border border-cyan-800">防呆機制啟用中</span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">親魚 A</label>
              <select id="breed-parent-a" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-400 focus:outline-none"></select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">親魚 B</label>
              <select id="breed-parent-b" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-400 focus:outline-none"></select>
            </div>
          </div>
          <div id="breed-result" class="bg-slate-900 p-4 rounded-xl border border-slate-700/80 space-y-2">
            <div class="text-xs text-slate-400">官方理論機率分佈：</div>
            <div id="breed-result-content" class="text-sm font-semibold text-slate-200">請選擇兩隻親魚進行計算</div>
          </div>
          <div class="border-t border-slate-700/60 pt-3 space-y-2">
            <div class="text-xs font-medium text-slate-300">
              <i class="fa-solid fa-flask text-amber-400"></i> 回報實測繁殖結果 (具備防呆攔截)
            </div>
            <div class="flex gap-2">
              <select id="breed-actual-child" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs focus:border-cyan-400 focus:outline-none"></select>
              <button onclick="recordBreedExperiment()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-all">紀錄 +1</button>
            </div>
          </div>
        </div>

        <!-- Reverse Target Search -->
        <div class="bg-ocean-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
              <i class="fa-solid fa-bullseye"></i> 反向目標追蹤
            </h2>
            <span class="text-xs bg-amber-950 text-amber-300 px-2.5 py-1 rounded-full border border-amber-800">選目標找父母</span>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">選擇目標魚：</label>
            <select id="breed-target-fish" onchange="searchBreedParents()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-400 focus:outline-none"></select>
          </div>
          <div class="bg-slate-900 p-4 rounded-xl border border-slate-700/80 max-h-48 overflow-y-auto space-y-2">
            <div class="text-xs text-slate-400 flex justify-between">
              <span>建議親魚組合配方：</span>
              <span id="breed-parent-count" class="text-amber-400 font-bold">0 組</span>
            </div>
            <div id="breed-parent-results" class="space-y-1.5 text-xs"></div>
          </div>
        </div>
      </div>

      <!-- Live Experiment Table -->
      <div class="bg-ocean-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
          <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-cyan-400"></i> 實測繁殖紀錄資料庫 (社群共用)
          </h3>
          <input type="text" id="breed-search-filter" oninput="renderBreedRecords()" placeholder="搜尋魚種..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs w-full sm:w-64">
        </div>
        <div class="overflow-x-auto rounded-xl border border-slate-700">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-slate-900 text-slate-400 border-b border-slate-700">
                <th class="p-3">時間 (UTC+8)</th>
                <th class="p-3">親魚 A</th>
                <th class="p-3">親魚 B</th>
                <th class="p-3">實測產出</th>
                <th class="p-3 text-center">次數</th>
                <th class="p-3 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="breed-records-table-body" class="divide-y divide-slate-700/50 bg-slate-900/40"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 2: SYNTHESIS -->
    <div id="tab-synth" class="tab-content hidden space-y-6">
      <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 p-5 rounded-2xl border border-cyan-500/30 shadow-2xl space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-black text-white flex items-center gap-2">
            <i class="fa-solid fa-crown text-amber-400"></i> 第一季 15 種賽季魚固定 10 隻魚合成配方
          </h2>
          <span class="text-xs text-slate-400">點擊下方項目可展開查看詳細 10 隻配方</span>
        </div>
        <div id="season-recipes-container" class="space-y-2.5 pt-2"></div>
      </div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white border border-cyan-400 px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 z-50 text-xs flex items-center gap-2">
    <i id="toast-icon" class="fa-solid fa-circle-check text-cyan-400"></i>
    <span id="toast-msg">操作成功</span>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxkzwnnEPwrsTtZz6Rs3Y2gTS-Bsk1-ZGk1y6iUa8sx8WqH57_lYZys85oOjqLbNWD99w/exec";

    let userClientIp = "unknown";
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => { userClientIp = data.ip; })
      .catch(() => {});

    const SPECIES = [
      "陽光雀鯛", "紫羅蘭擬雀鯛", "藍寶石雀鯛", "烈焰扇尾金魚", "霜白太陽魚",
      "櫻桃鯽", "月角雀鯛", "苔背小精靈", "霓虹清潔隆頭魚", "三色錦鯉",
      "火鰭天竺鯛", "睡衣天竺鯛", "潟湖雀鯛", "銅帶蝴蝶魚", "緋紅天竺鯛",
      "星鰭邦加天竺鯛", "黃金蝴蝶魚", "霓虹條紋脂鯉", "稜鏡虹魚", "泡芙河豚",
      "紅頰火焰蝦虎", "金尾神仙魚", "天翼飛魚", "寶石花䲁", "藍電鮪魚",
      "霜藍翻車魚", "珊瑚小丑魚", "黃金海馬", "黃金長鰭雀鯛", "旭日蘭壽",
      "萊姆背海龜", "小藍鯨", "緋冠獅子魚", "紫水晶鬥魚", "祭典章魚"
    ];

    const FISH_DB = [{ id: "000", num: 0, name: "金魚", star: 0, category: "基本", cleanName: "金魚", displayName: "金魚 ☆ [基本]" }];
    let currentId = 1;

    SPECIES.forEach(sp => {
      for (let star = 1; star <= 5; star++) {
        const idStr = String(currentId).padStart(3, '0');
        let category = "普通";
        if (currentId >= 46 && currentId <= 90) category = "高級";
        else if (currentId >= 91 && currentId <= 130) category = "稀有";
        else if (currentId >= 131 && currentId <= 155) category = "傳說";
        else if (currentId >= 156 && currentId <= 175) category = "神話";

        const starStr = '☆'.repeat(star);
        const fullName = `${sp} ${starStr}`;
        FISH_DB.push({
          id: idStr,
          num: currentId,
          name: fullName,
          star: star,
          category: category,
          cleanName: `${fullName} [${category}]`,
          displayName: formatFishDisplayName(idStr, fullName, category)
        });
        currentId++;
      }
    });

    function formatFishDisplayName(id, name, cat) {
      let catSpan = `<span class="${getCategoryColorClass(cat)}">[${cat}]</span>`;
      return `${name} ${catSpan}`;
    }

    function getCategoryColorClass(cat) {
      switch(cat) {
        case '基本': return 'text-slate-400';
        case '普通': return 'text-white';
        case '高級': return 'text-emerald-400';
        case '稀有': return 'text-amber-400 font-bold';
        case '傳說': return 'text-orange-500 font-bold';
        case '神話': return 'text-purple-400 font-bold';
        default: return 'text-slate-200';
      }
    }

    function colorizeCategoriesInText(text) {
      return text
        .replace(/神話/g, '<span class="text-purple-400 font-bold">神話</span>')
        .replace(/傳說/g, '<span class="text-orange-500 font-bold">傳說</span>')
        .replace(/稀有/g, '<span class="text-amber-400 font-bold">稀有</span>')
        .replace(/高級/g, '<span class="text-emerald-400 font-bold">高級</span>')
        .replace(/普通/g, '<span class="text-white">普通</span>')
        .replace(/基本/g, '<span class="text-slate-400">基本</span>');
    }

    const SEASON_RECIPES = [
      { target: "126", materials: ["066","031","031","031","041","041","041","036","036","036"] },
      { target: "127", materials: ["126","032","032","032","042","042","042","037","037","037"] },
      { target: "128", materials: ["127","033","033","033","043","043","043","038","038","038"] },
      { target: "129", materials: ["128","034","034","034","044","044","044","039","039","039"] },
      { target: "130", materials: ["129","035","035","035","045","045","045","040","040","040"] },
      { target: "151", materials: ["101","076","076","076","081","081","081","086","086","086"] },
      { target: "152", materials: ["151","077","077","077","082","082","082","087","087","087"] },
      { target: "153", materials: ["152","078","078","078","083","083","083","088","088","088"] },
      { target: "154", materials: ["153","079","079","079","084","084","084","089","089","089"] },
      { target: "155", materials: ["154","080","080","080","085","085","085","090","090","090"] },
      { target: "171", materials: ["141","096","096","096","111","111","111","106","106","106"] },
      { target: "172", materials: ["171","097","097","097","112","112","112","107","107","107"] },
      { target: "173", materials: ["172","098","098","098","113","113","113","108","108","108"] },
      { target: "174", materials: ["173","099","099","099","114","114","114","109","109","109"] },
      { target: "175", materials: ["174","100","100","100","115","115","115","110","110","110"] }
    ];

    let localBreedRecords = JSON.parse(localStorage.getItem('pcfish_breed_records') || '[]');

    window.addEventListener('DOMContentLoaded', () => {
      initDropdowns();
      renderSeasonRecipes();
      calculateBreedPrediction();
      fetchAllRecordsFromGAS();
      setInterval(fetchAllRecordsFromGAS, 10000);
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('border-cyan-400', 'text-cyan-400', 'bg-slate-800/80');
        btn.classList.add('border-transparent', 'text-slate-400');
      });
      document.getElementById(tabId).classList.remove('hidden');
      const activeNav = document.getElementById('nav-' + tabId.replace('tab-', ''));
      if(activeNav) {
        activeNav.classList.add('border-cyan-400', 'text-cyan-400', 'bg-slate-800/80');
        activeNav.classList.remove('border-transparent', 'text-slate-400');
      }
    }

    function initDropdowns() {
      const optionsHtml = FISH_DB.map(f => {
        return `<option value="${f.id}">${f.cleanName}</option>`;
      }).join('');
      ['breed-parent-a', 'breed-parent-b', 'breed-actual-child', 'breed-target-fish'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.innerHTML = optionsHtml;
      });
      document.getElementById('breed-parent-a').addEventListener('change', calculateBreedPrediction);
      document.getElementById('breed-parent-b').addEventListener('change', calculateBreedPrediction);
    }

    // 精準對應使用者提供的所有 20 種官方配方（雙向不分順序）
    function getValidCategories(c1, c2) {
      let pair = [c1, c2].sort().join('+');
      
      if (pair === '基本+基本') return { text: "普通 100%", allowed: ["普通"] };
      if (pair === '基本+普通') return { text: "高級 10% | 普通 90%", allowed: ["高級", "普通"] };
      if (pair === '基本+高級') return { text: "稀有 4% | 高級 20% | 普通 76%", allowed: ["稀有", "高級", "普通"] };
      if (pair === '普通+普通') return { text: "稀有 4% | 高級 20% | 普通 76%", allowed: ["稀有", "高級", "普通"] };
      if (pair === '普通+高級') return { text: "稀有 9.5% | 高級 41.6% | 普通 48.8%", allowed: ["稀有", "高級", "普通"] };
      if (pair === '高級+高級') return { text: "傳說 3% | 稀有 15% | 高級 44.2% | 普通 37.7%", allowed: ["傳說", "稀有", "高級", "普通"] };
      if (pair === '基本+稀有') return { text: "稀有 9.5% | 高級 41.6% | 普通 48.8%", allowed: ["稀有", "高級", "普通"] };
      if (pair === '普通+稀有') return { text: "傳說 3% | 稀有 15% | 高級 44.2% | 普通 37.7%", allowed: ["傳說", "稀有", "高級", "普通"] };
      if (pair === '高級+稀有') return { text: "傳說 6.5% | 稀有 43% | 高級 50.4%", allowed: ["傳說", "稀有", "高級"] };
      if (pair === '稀有+稀有') return { text: "神話 2% | 傳說 10% | 稀有 47.5% | 高級 40.4%", allowed: ["神話", "傳說", "稀有", "高級"] };
      if (pair === '基本+傳說') return { text: "傳說 3% | 稀有 15% | 高級 44.2% | 普通 37.7%", allowed: ["傳說", "稀有", "高級", "普通"] };
      if (pair === '普通+傳說') return { text: "傳說 6.5% | 稀有 43% | 高級 50.4%", allowed: ["傳說", "稀有", "高級"] };
      if (pair === '高級+傳說') return { text: "神話 2% | 傳說 10% | 稀有 47.5% | 高級 40.4%", allowed: ["神話", "傳說", "稀有", "高級"] };
      if (pair === '稀有+傳說') return { text: "神話 3.5% | 傳說 44.3% | 稀有 52.1%", allowed: ["神話", "傳說", "稀有"] };
      if (pair === '傳說+傳說') return { text: "神話 5% | 傳說 51.3% | 稀有 43.7%", allowed: ["神話", "傳說", "稀有"] };
      if (pair === '基本+神話') return { text: "傳說 6.5% | 稀有 43% | 高級 50.4%", allowed: ["傳說", "稀有", "高級"] };
      if (pair === '普通+神話') return { text: "神話 2% | 傳說 10% | 稀有 47.5% | 高級 40.4%", allowed: ["神話", "傳說", "稀有", "高級"] };
      if (pair === '高級+神話') return { text: "神話 3.5% | 傳說 44.3% | 稀有 52.1%", allowed: ["神話", "傳說", "稀有"] };
      if (pair === '稀有+神話') return { text: "神話 5% | 傳說 51.3% | 稀有 43.7%", allowed: ["神話", "傳說", "稀有"] };
      
      return { text: "稀有 9.5% | 高級 41.6% | 普通 48.8%", allowed: ["稀有", "高級", "普通"] };
    }

    function calculateBreedPrediction() {
      const pA = FISH_DB.find(f => f.id === document.getElementById('breed-parent-a').value);
      const pB = FISH_DB.find(f => f.id === document.getElementById('breed-parent-b').value);
      const resContainer = document.getElementById('breed-result-content');
      
      if (!pA || !pB) return;
      const resultRule = getValidCategories(pA.category, pB.category);
      let formattedText = colorizeCategoriesInText(resultRule.text);

      resContainer.innerHTML = `<div>${pA.displayName} × ${pB.displayName}</div><div class="mt-1">【機率預測】${formattedText}</div>`;
    }

    function fetchAllRecordsFromGAS() {
      if (!GAS_API_URL || GAS_API_URL.includes("您的_GOOGLE_APPS_SCRIPT_網址")) {
        renderBreedRecords();
        return;
      }

      fetch(GAS_API_URL + "?t=" + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          if (data.breed) {
            localBreedRecords = data.breed;
            localStorage.setItem('pcfish_breed_records', JSON.stringify(localBreedRecords));
            renderBreedRecords();
            searchBreedParents();
          }
        })
        .catch(err => { console.error("同步失敗", err); });
    }

    function searchBreedParents() {
      const targetId = document.getElementById('breed-target-fish').value;
      const targetFish = FISH_DB.find(f => f.id === targetId);
      const resContainer = document.getElementById('breed-parent-results');
      const countEl = document.getElementById('breed-parent-count');

      const matches = localBreedRecords.filter(r => String(r.child).padStart(3, '0') === String(targetId).padStart(3, '0'));
      if(matches.length === 0) {
        countEl.innerText = "0 組";
        resContainer.innerHTML = `<div class="text-slate-500 text-center py-2">尚無 ${targetFish ? targetFish.displayName : targetId} 的紀錄</div>`;
      } else {
        countEl.innerText = `${matches.length} 組`;
        resContainer.innerHTML = matches.map(m => {
          const fA = FISH_DB.find(f => f.id === String(m.pA).padStart(3, '0'));
          const fB = FISH_DB.find(f => f.id === String(m.pB).padStart(3, '0'));
          return `<div class="bg-slate-800/80 p-2 rounded border border-slate-700/50 flex justify-between items-center">
            <span>${fA ? fA.displayName : m.pA} + ${fB ? fB.displayName : m.pB}</span>
            <span class="text-amber-400 font-bold">${m.count} 次</span>
          </div>`;
        }).join('');
      }
    }

    function recordBreedExperiment() {
      const parentAId = document.getElementById('breed-parent-a').value;
      const parentBId = document.getElementById('breed-parent-b').value;
      const childId = document.getElementById('breed-actual-child').value;

      const pA = FISH_DB.find(f => f.id === parentAId);
      const pB = FISH_DB.find(f => f.id === parentBId);
      const childFish = FISH_DB.find(f => f.id === childId);

      const rule = getValidCategories(pA.category, pB.category);
      if (!rule.allowed.includes(childFish.category)) {
        alert(`【防呆機制攔截】\n\n根據官方配方 (${pA.category} + ${pB.category})，不可能生出等級為 [${childFish.category}] 的「${childFish.displayName}」！\n\n正確產出範圍應為：${rule.text}\n請重新選擇正確的實測產出魚種。`);
        return;
      }

      const payload = {
        action: "addBreed",
        parentA: parentAId,
        parentB: parentBId,
        child: childId,
        ip: userClientIp
      };

      showToast("正在上傳紀錄至社群資料庫...");

      const nowStr = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
      localBreedRecords.unshift({
        pA: parentAId,
        pB: parentBId,
        child: childId,
        time: nowStr,
        count: 1,
        ip: userClientIp
      });
      renderBreedRecords();
      searchBreedParents();

      if (GAS_API_URL && !GAS_API_URL.includes("您的_GOOGLE_APPS_SCRIPT_網址")) {
        fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(() => {
          showToast("上傳成功！");
          setTimeout(fetchAllRecordsFromGAS, 1500);
        });
      } else {
        showToast("已存檔！");
      }
    }

    function renderBreedRecords() {
      const filterText = document.getElementById('breed-search-filter')?.value.toLowerCase() || '';
      const tbody = document.getElementById('breed-records-table-body');
      if(!tbody) return;

      const filtered = localBreedRecords.filter(r => {
        const fA = FISH_DB.find(f => f.id === String(r.pA).padStart(3, '0'));
        const fB = FISH_DB.find(f => f.id === String(r.pB).padStart(3, '0'));
        const fC = FISH_DB.find(f => f.id === String(r.child).padStart(3, '0'));
        return ((r.time || '') + (fA?.displayName || '') + (fB?.displayName || '') + (fC?.displayName || '')).toLowerCase().includes(filterText);
      });

      const latestTen = filtered.slice(0, 10);

      if(latestTen.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">尚無相關紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = latestTen.map((r) => {
        const fA = FISH_DB.find(f => f.id === String(r.pA).padStart(3, '0'));
        const fB = FISH_DB.find(f => f.id === String(r.pB).padStart(3, '0'));
        const fC = FISH_DB.find(f => f.id === String(r.child).padStart(3, '0'));
        
        let canDelete = (!r.ip || r.ip === userClientIp || userClientIp === "unknown");
        let deleteBtnHtml = canDelete ? `<button onclick="deleteBreedRecord('${r.pA}', '${r.pB}', '${r.child}')" class="text-red-400 hover:underline cursor-pointer">刪除</button>` : `<span class="text-slate-600 text-[10px]">非本人</span>`;

        return `<tr class="border-b border-slate-800 hover:bg-slate-800/30">
          <td class="p-3 text-slate-400 text-[11px]">${r.time || '剛剛'}</td>
          <td class="p-3">${fA ? fA.displayName : r.pA}</td>
          <td class="p-3">${fB ? fB.displayName : r.pB}</td>
          <td class="p-3 text-cyan-300 font-semibold">${fC ? fC.displayName : r.child}</td>
          <td class="p-3 text-center">${r.count} 次</td>
          <td class="p-3 text-right">${deleteBtnHtml}</td>
        </tr>`;
      }).join('');
    }

    function deleteBreedRecord(pA, pB, child) {
      if(!confirm("確定要刪除這筆實測紀錄嗎？")) return;

      if (GAS_API_URL && !GAS_API_URL.includes("您的_GOOGLE_APPS_SCRIPT_網址")) {
        fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "deleteBreed", parentA: pA, parentB: pB, child: child })
        }).then(() => {
          showToast("已送出刪除指令");
          setTimeout(fetchAllRecordsFromGAS, 1500);
        });
      }

      localBreedRecords = localBreedRecords.filter(r => !(String(r.pA).padStart(3, '0') === String(pA).padStart(3, '0') && String(r.pB).padStart(3, '0') === String(pB).padStart(3, '0') && String(r.child).padStart(3, '0') === String(child).padStart(3, '0')));
      localStorage.setItem('pcfish_breed_records', JSON.stringify(localBreedRecords));
      renderBreedRecords();
      searchBreedParents();
      showToast("已刪除");
    }

    function renderSeasonRecipes() {
      const container = document.getElementById('season-recipes-container');
      if(!container) return;
      
      container.innerHTML = SEASON_RECIPES.map((recipe, index) => {
        const targetFish = FISH_DB.find(f => f.id === recipe.target);
        const counts = {};
        recipe.materials.forEach(m => { counts[m] = (counts[m] || 0) + 1; });
        
        const matListStr = Object.entries(counts).map(([mId, qty]) => {
          const f = FISH_DB.find(x => x.id === mId);
          return `<span class="bg-slate-900 border border-slate-700 px-2.5 py-1 rounded text-xs font-medium">${f ? f.displayName : mId} <span class="text-amber-400 font-bold">×${qty}</span></span>`;
        }).join(' ');

        return `<div class="bg-slate-900/80 rounded-xl border border-slate-700 overflow-hidden transition-all">
          <div onclick="toggleRecipe(${index})" class="p-3.5 flex justify-between items-center cursor-pointer hover:bg-slate-800/60">
            <div class="flex items-center space-x-3">
              <span class="bg-amber-400/10 text-amber-400 border border-amber-400/30 px-2.5 py-0.5 rounded text-xs font-bold">#${recipe.target}</span>
              <span class="font-bold text-slate-100 text-sm">${targetFish ? targetFish.displayName : recipe.target}</span>
            </div>
            <div class="flex items-center gap-2 text-xs text-cyan-400 font-medium">
              <span>點擊查看 10 隻配方</span>
              <i id="recipe-icon-${index}" class="fa-solid fa-chevron-down transition-transform"></i>
            </div>
          </div>
          <div id="recipe-body-${index}" class="hidden p-3.5 bg-slate-950/60 border-t border-slate-800 flex flex-wrap gap-2">
            ${matListStr}
          </div>
        </div>`;
      }).join('');
    }

    function toggleRecipe(index) {
      const body = document.getElementById(`recipe-body-${index}`);
      const icon = document.getElementById(`recipe-icon-${index}`);
      if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        icon.classList.add('rotate-180');
      } else {
        body.classList.add('hidden');
        icon.classList.remove('rotate-180');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 2500);
    }
  </script>
</body>
</html>
