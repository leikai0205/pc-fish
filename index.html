<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Fish 養魚全能數據資料庫</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🐟</span>
                <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">PC Fish 數據資料庫</h1>
            </div>
            <nav class="flex space-x-2 mt-2 sm:mt-0">
                <button onclick="switchTab('database')" id="btn-database" class="px-4 py-2 rounded-lg font-medium bg-cyan-600 text-white transition-all shadow-lg shadow-cyan-900/50">數據查詢與社群回報</button>
                <button onclick="switchTab('synthesis')" id="btn-synthesis" class="px-4 py-2 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all">合成模擬與自訂魚池</button>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">

        <!-- ==================== 分頁 1：數據查詢與社群回報 ==================== -->
        <div id="tab-database" class="space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-cyan-400 mb-4 flex items-center gap-2">
                    <span>📊</span> 雙親合成配方搜尋與實測回報
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">親魚 A</label>
                        <select id="search-parent-a" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="">請選擇親魚 A</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">親魚 B</label>
                        <select id="search-parent-b" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="">請選擇親魚 B</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3">
                    <button onclick="handleSearch()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-6 py-2 rounded-lg transition-all shadow-md">查詢配方</button>
                    <button onclick="openReportModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-6 py-2 rounded-lg transition-all shadow-md">➕ 回報實測結果</button>
                    <button onclick="resetSearch()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium px-4 py-2 rounded-lg transition-all">清除</button>
                </div>
            </div>

            <!-- 查詢結果區 -->
            <div id="search-results-container" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl hidden">
                <h3 class="text-md font-semibold text-slate-200 mb-3">查詢結果與社群實測統計</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-700 text-slate-400 text-sm">
                                <th class="py-3 px-4">產出魚種</th>
                                <th class="py-3 px-4">階級</th>
                                <th class="py-3 px-4">累積回報次數</th>
                                <th class="py-3 px-4">最後更新時間</th>
                                <th class="py-3 px-4 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="results-table-body" class="divide-y divide-slate-700/50 text-sm">
                            <!-- 動態插入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ==================== 分頁 2：合成模擬與自訂魚池 ==================== -->
        <div id="tab-synthesis" class="space-y-6 hidden">
            <!-- 自訂魚隻管理區塊 -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-emerald-400 flex items-center gap-2">
                        <span>🛠️</span> 自訂魚種管理（擴充魚池）
                    </h2>
                    <span class="text-xs text-slate-400">在此新增的魚種會自動同步至下拉選單與合成系統中</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">魚隻名稱</label>
                        <input type="text" id="custom-fish-name" placeholder="例如：黃金神仙魚" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">對應階級</label>
                        <select id="custom-fish-tier" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500">
                            <option value="1">Tier 1 (初階)</option>
                            <option value="2">Tier 2 (中階)</option>
                            <option value="3">Tier 3 (高階)</option>
                            <option value="4">Tier 4 (頂階)</option>
                            <option value="5">Tier 5 (賽季/神級)</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="addCustomFish()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg transition-all shadow-md">新增自訂魚種</button>
                    </div>
                </div>

                <!-- 已新增的自訂魚列表 -->
                <div>
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">已建立的自訂魚清單：</h4>
                    <div id="custom-fish-list" class="flex flex-wrap gap-2">
                        <!-- 動態插入標籤 -->
                    </div>
                </div>
            </div>

            <!-- 合成模擬器區塊 -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-cyan-400 mb-4 flex items-center gap-2">
                    <span>🧬</span> 合成模擬器與逆向追蹤
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">選擇親魚 A</label>
                        <select id="sim-parent-a" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="">請選擇親魚 A</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">選擇親魚 B</label>
                        <select id="sim-parent-b" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="">請選擇親魚 B</option>
                        </select>
                    </div>
                </div>
                <button onclick="runSimulation()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-6 py-2 rounded-lg transition-all shadow-md">計算可能產出</button>

                <div id="simulation-result" class="mt-6 hidden border-t border-slate-700 pt-4">
                    <h4 class="text-sm font-semibold text-slate-300 mb-2">模擬產出結果：</h4>
                    <div id="sim-result-content" class="text-slate-200 bg-slate-900 p-4 rounded-xl border border-slate-700"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- ==================== 回報實測結果彈跳視窗 ==================== -->
    <div id="report-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <h3 class="text-lg font-bold text-cyan-400 mb-4">➕ 回報合成實測結果</h3>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">親魚 A</label>
                    <select id="report-parent-a" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200">
                        <option value="">請選擇親魚 A</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">親魚 B</label>
                    <select id="report-parent-b" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200">
                        <option value="">請選擇親魚 B</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">實際生出的子代 (產出魚)</label>
                    <select id="report-child" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200">
                        <option value="">請選擇產出魚</option>
                    </select>
                    <p class="text-xs text-amber-400 mt-1">⚠️ 系統具備防呆機制：若子代階級不符合規則將會被攔截。</p>
                </div>
            </div>

            <div class="flex justify-end space-x-3">
                <button onclick="closeReportModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg transition-all">取消</button>
                <button onclick="submitReport()" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-all shadow-md">確認送出回報</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // ⚠️ 請在這裡貼上你的 Google Apps Script 網頁應用程式網址
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxkzwnnEPwrsTtZz6Rs3Y2gTS-Bsk1-ZGk1y6iUa8sx8WqH57_lYZys85oOjqLbNWD99w/exec";

        // 預設官方魚資料庫 (包含各階級與賽季魚)
        const DEFAULT_FISH_DATABASE = [
            { name: "小丑魚", tier: 1 },
            { name: "孔雀魚", tier: 1 },
            { name: "斑馬魚", tier: 1 },
            { name: "神仙魚", tier: 2 },
            { name: "鬥魚", tier: 2 },
            { name: "血鸚鵡", tier: 3 },
            { name: "黃金龍魚", tier: 4 },
            { name: "賽季限定·深淵巨獸", tier: 5 },
            { name: "賽季限定·黃金幻影", tier: 5 }
        ];

        let cloudBreedRecords = [];
        let userClientIP = "unknown-ip";

        // 取得使用者的 IP 供刪除權限辨識
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { userClientIP = data.ip; })
            .catch(() => {});

        // 載入自訂魚隻 (LocalStorage)
        function getCustomFishList() {
            try {
                const saved = localStorage.getItem('pc_fish_custom_list');
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                return [];
            }
        }

        // 取得所有魚種 (官方 + 自訂)
        function getAllFish() {
            return [...DEFAULT_FISH_DATABASE, ...getCustomFishList()];
        }

        // 切換分頁
        function switchTab(tabName) {
            if (tabName === 'database') {
                document.getElementById('tab-database').classList.remove('hidden');
                document.getElementById('tab-synthesis').classList.add('hidden');
                document.getElementById('btn-database').className = "px-4 py-2 rounded-lg font-medium bg-cyan-600 text-white transition-all shadow-lg shadow-cyan-900/50";
                document.getElementById('btn-synthesis').className = "px-4 py-2 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all";
            } else {
                document.getElementById('tab-database').classList.add('hidden');
                document.getElementById('tab-synthesis').classList.remove('hidden');
                document.getElementById('btn-database').className = "px-4 py-2 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all";
                document.getElementById('btn-synthesis').className = "px-4 py-2 rounded-lg font-medium bg-cyan-600 text-white transition-all shadow-lg shadow-cyan-900/50";
                renderCustomFishListUI();
            }
        }

        // 初始化所有下拉選單
        function populateDropdowns() {
            const allFish = getAllFish();
            const selects = [
                'search-parent-a', 'search-parent-b',
                'sim-parent-a', 'sim-parent-b',
                'report-parent-a', 'report-parent-b', 'report-child'
            ];

            selects.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const currentVal = el.value;
                el.innerHTML = `<option value="">請選擇魚種</option>` + allFish.map(f => `<option value="${f.name}">${f.name} (Tier ${f.tier})</option>`).join('');
                el.value = currentVal;
            });
        }

        // 新增自訂魚種
        function addCustomFish() {
            const nameInput = document.getElementById('custom-fish-name');
            const tierInput = document.getElementById('custom-fish-tier');
            const name = nameInput.value.trim();
            const tier = parseInt(tierInput.value);

            if (!name) {
                alert("請輸入自訂魚隻名稱！");
                return;
            }

            const allFish = getAllFish();
            if (allFish.some(f => f.name === name)) {
                alert("此魚種名稱已存在（包含官方或自訂魚）！");
                return;
            }

            const customList = getCustomFishList();
            customList.push({ name, tier });
            localStorage.setItem('pc_fish_custom_list', JSON.stringify(customList));

            nameInput.value = "";
            populateDropdowns();
            renderCustomFishListUI();
            alert(`成功新增自訂魚種：${name}！`);
        }

        // 刪除自訂魚種
        function removeCustomFish(name) {
            if (!confirm(`確定要刪除自訂魚種「${name}」嗎？`)) return;
            let customList = getCustomFishList();
            customList = customList.filter(f => f.name !== name);
            localStorage.setItem('pc_fish_custom_list', JSON.stringify(customList));
            populateDropdowns();
            renderCustomFishListUI();
        }

        // 渲染自訂魚列表 UI
        function renderCustomFishListUI() {
            const container = document.getElementById('custom-fish-list');
            const customList = getCustomFishList();
            if (customList.length === 0) {
                container.innerHTML = `<span class="text-sm text-slate-500 italic">目前尚無自訂魚種，請於上方新增。</span>`;
                return;
            }
            container.innerHTML = customList.map(f => `
                <div class="flex items-center bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg text-sm gap-2">
                    <span class="text-emerald-400 font-medium">${f.name}</span>
                    <span class="text-xs text-slate-500">(Tier ${f.tier})</span>
                    <button onclick="removeCustomFish('${f.name}')" class="text-rose-400 hover:text-rose-300 ml-1 font-bold">×</button>
                </div>
            `).join('');
        }

        // 從 Google Sheets 抓取資料
        function fetchCloudData() {
            if (GAS_API_URL.includes("你的_Google_Apps_Script_網址")) return;
            fetch(GAS_API_URL)
                .then(res => res.json())
                .then(data => {
                    if (data && data.breed) {
                        cloudBreedRecords = data.breed;
                    }
                })
                .catch(err => console.error("無法同步雲端資料", err));
        }

        // 查詢配方
        function handleSearch() {
            const pA = document.getElementById('search-parent-a').value;
            const pB = document.getElementById('search-parent-b').value;

            if (!pA || !pB) {
                alert("請完整選擇親魚 A 與親魚 B！");
                return;
            }

            const matched = cloudBreedRecords.filter(r => 
                (r.pA === pA && r.pB === pB) || (r.pA === pB && r.pB === pA)
            );

            const container = document.getElementById('search-results-container');
            const tbody = document.getElementById('results-table-body');
            container.classList.remove('hidden');

            if (matched.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">目前尚無此雙親組合的社群回報紀錄，歡迎點擊上方「回報實測結果」按鈕提供數據！</td></tr>`;
                return;
            }

            tbody.innerHTML = matched.map(m => `
                <tr class="hover:bg-slate-700/30 transition-all">
                    <td class="py-3 px-4 font-medium text-cyan-300">${m.child}</td>
                    <td class="py-3 px-4 text-slate-400">社群實測</td>
                    <td class="py-3 px-4 font-bold text-emerald-400">${m.count} 次</td>
                    <td class="py-3 px-4 text-xs text-slate-400">${m.time}</td>
                    <td class="py-3 px-4 text-right">
                        ${m.ip === userClientIP ? `<button onclick="deleteRecord('${m.pA}', '${m.pB}', '${m.child}')" class="text-rose-400 hover:text-rose-300 text-xs bg-rose-950/50 border border-rose-800 px-2 py-1 rounded">刪除</button>` : `<span class="text-xs text-slate-600">他人上傳</span>`}
                    </td>
                </tr>
            `).join('');
        }

        function resetSearch() {
            document.getElementById('search-parent-a').value = "";
            document.getElementById('search-parent-b').value = "";
            document.getElementById('search-results-container').classList.add('hidden');
        }

        // 回報彈跳視窗控制
        function openReportModal() {
            document.getElementById('report-modal').classList.remove('hidden');
            document.getElementById('report-modal').classList.add('flex');
        }
        function closeReportModal() {
            document.getElementById('report-modal').classList.remove('flex');
            document.getElementById('report-modal').classList.add('hidden');
        }

        // 送出回報 (具備防呆機制)
        function submitReport() {
            const pA = document.getElementById('report-parent-a').value;
            const pB = document.getElementById('report-parent-b').value;
            const child = document.getElementById('report-child').value;

            if (!pA || !pB || !child) {
                alert("請完整填寫親魚與子代資料！");
                return;
            }

            if (pA === pB && !confirm("警告：親魚 A 與親魚 B 為相同魚種，確定要繼續回報嗎？")) {
                return;
            }

            // 防呆機制檢查：子代階級必須大於或等於雙親的最大階級
            const allFish = getAllFish();
            const fishObjA = allFish.find(f => f.name === pA);
            const fishObjB = allFish.find(f => f.name === pB);
            const fishObjChild = allFish.find(f => f.name === child);

            if (fishObjA && fishObjB && fishObjChild) {
                const maxParentTier = Math.max(fishObjA.tier, fishObjB.tier);
                if (fishObjChild.tier < maxParentTier) {
                    alert(`❌ 防呆攔截：子代 (${child} - Tier ${fishObjChild.tier}) 的階級低於雙親最高階級 (Tier ${maxParentTier})，不符合育成邏輯，回報已被取消！`);
                    return;
                }
            }

            if (GAS_API_URL.includes("你的_Google_Apps_Script_網址")) {
                alert("尚未設定 GAS 網址，無法上傳至雲端！");
                return;
            }

            const payload = {
                action: "addBreed",
                parentA: pA,
                parentB: pB,
                child: child,
                ip: userClientIP
            };

            fetch(GAS_API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    alert("成功回報實測數據！");
                    closeReportModal();
                    fetchCloudData();
                } else {
                    alert("回報失敗：" + data.message);
                }
            })
            .catch(err => {
                alert("網路連線錯誤，請檢查 GAS 部署設定。");
            });
        }

        // 刪除紀錄
        function deleteRecord(pA, pB, child) {
            if (!confirm("確定要刪除這筆你上傳的紀錄嗎？")) return;
            fetch(GAS_API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteBreed", parentA: pA, parentB: pB, child: child })
            })
            .then(res => res.json())
            .then(() => {
                fetchCloudData();
                setTimeout(handleSearch, 500);
            });
        }

        // 合成模擬
        function runSimulation() {
            const pA = document.getElementById('sim-parent-a').value;
            const pB = document.getElementById('sim-parent-b').value;
            const resContainer = document.getElementById('simulation-result');
            const resContent = document.getElementById('sim-result-content');

            if (!pA || !pB) {
                alert("請選擇要模擬的親魚！");
                return;
            }

            resContainer.classList.remove('hidden');
            const allFish = getAllFish();
            const fA = allFish.find(f => f.name === pA);
            const fB = allFish.find(f => f.name === pB);

            // 從社群紀錄找找看
            const matched = cloudBreedRecords.filter(r => 
                (r.pA === pA && r.pB === pB) || (r.pA === pB && r.pB === pA)
            );

            let html = `<p class="mb-2 text-slate-300">模擬雙親：<span class="text-cyan-400 font-bold">${pA}</span> (Tier ${fA?.tier || '?'}) + <span class="text-cyan-400 font-bold">${pB}</span> (Tier ${fB?.tier || '?'})</p>`;

            if (matched.length > 0) {
                html += `<p class="text-emerald-400 font-semibold mb-2">✨ 根據社群實測資料，可能產出以下結果：</p><ul class="list-disc pl-5 space-y-1">`;
                matched.forEach(m => {
                    html += `<li><span class="text-white font-medium">${m.child}</span> (累計實測回報：${m.count} 次)</li>`;
                });
                html += `</ul>`;
            } else {
                const targetTier = Math.min(Math.max(fA.tier, fB.tier) + 1, 5);
                const possibleChildren = allFish.filter(f => f.tier === targetTier);
                html += `<p class="text-amber-400 font-semibold mb-2">📊 目前尚無社群實測，依據階級規則推估可能產出 (Tier ${targetTier})：</p><ul class="list-disc pl-5 space-y-1">`;
                if (possibleChildren.length > 0) {
                    possibleChildren.forEach(pc => {
                        html += `<li><span class="text-white font-medium">${pc.name}</span></li>`;
                    });
                } else {
                    html += `<li>已達最高階級或無對應魚種</li>`;
                }
                html += `</ul>`;
            }

            resContent.innerHTML = html;
        }

        // 頁面初次載入
        window.onload = function() {
            populateDropdowns();
            fetchCloudData();
            // 每 10 秒自動輪詢雲端資料
            setInterval(fetchCloudData, 10000);
        };
    </script>
</body>
</html>
