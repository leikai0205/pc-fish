<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Fish 養魚全能數據資料庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ocean: {
              800: '#0f172a',
              900: '#0b1120',
              700: '#1e293b',
              accent: '#38bdf8',
              gold: '#f59e0b'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-ocean-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Header -->
  <header class="bg-ocean-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <i class="fa-solid font-bold text-2xl text-cyan-400 fa-fish"></i>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
            PC Fish 養魚全能數據資料庫
          </h1>
          <p class="text-xs text-slate-400">繁殖機率預測 • 10隻魚合成與賽季固定配方</p>
        </div>
      </div>
    </div>

    <!-- Nav Tabs -->
    <div class="max-w-7xl mx-auto px-4 flex space-x-2 border-t border-slate-700/50 pt-2">
      <button id="nav-breed" onclick="switchTab('tab-breed')" class="nav-btn px-4 py-2 text-sm font-semibold rounded-t-lg transition-all flex items-center gap-2 border-b-2 border-cyan-400 text-cyan-400 bg-slate-800/80">
        <i class="fa-solid fa-heart"></i> 繁殖計算器
      </button>
      <button id="nav-synth" onclick="switchTab('tab-synth')" class="nav-btn px-4 py-2 text-sm font-semibold rounded-t-lg transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200 border-b-2 border-transparent">
        <i class="fa-solid fa-wand-magic-sparkles"></i> 10隻魚合成與賽季配方
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- TAB 1: BREEDING -->
    <div id="tab-breed" class="tab-content space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Forward Breeding -->
        <div class="bg-ocean-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-cyan-400 flex items-center gap-2">
              <i class="fa-solid fa-dna"></i> 正向雙親繁殖預測
            </h2>
            <span class="text-xs bg-cyan-950 text-cyan-300 px-2.5 py-1 rounded-full border border-cyan-800">選雙親找後代</span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">親魚 A</label>
              <select id="breed-parent-a" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-400 focus:outline-none"></select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">親魚 B</label>
              <select id="breed-parent-b" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-400 focus:outline-none"></select>
            </div>
          </div>
          <div id="breed-result" class="bg-slate-900 p-4 rounded-xl border border-slate-700/80 space-y-2">
            <div class="text-xs text-slate-400">理論繁殖結果：</div>
            <div id="breed-result-content" class="text-sm font-semibold text-slate-200">請選擇兩隻親魚進行計算</div>
          </div>
          <div class="border-t border-slate-700/60 pt-3 space-y-2">
            <div class="text-xs font-medium text-slate-300 flex items-center justify-between">
              <span><i class="fa-solid fa-flask text-amber-400"></i> 回報實測繁殖結果</span>
            </div>
            <div class="flex gap-2">
              <select id="breed-actual-child" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs focus:border-cyan-400 focus:outline-none"></select>
              <button onclick="recordBreedExperiment()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-all">紀錄 +1</button>
            </div>
          </div>
        </div>

        <!-- Reverse Target Search -->
        <div class="bg-ocean-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
              <i class="fa-solid fa-bullseye"></i> 反向目標追蹤 (我想生這隻魚)
            </h2>
            <span class="text-xs bg-amber-950 text-amber-300 px-2.5 py-1 rounded-full border border-amber-800">選目標找父母</span>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">選擇目標魚：</label>
            <select id="breed-target-fish" onchange="searchBreedParents()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-400 focus:outline-none"></select>
          </div>
          <div class="bg-slate-900 p-4 rounded-xl border border-slate-700/80 max-h-48 overflow-y-auto space-y-2">
            <div class="text-xs text-slate-400 flex justify-between">
              <span>建議親魚組合配方：</span>
              <span id="breed-parent-count" class="text-amber-400 font-bold">0 組</span>
            </div>
            <div id="breed-parent-results" class="space-y-1.5 text-xs"></div>
          </div>
        </div>
      </div>

      <!-- Live Experiment Table -->
      <div class="bg-ocean-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
          <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-cyan-400"></i> 實測繁殖紀錄資料庫 (社群共用)
          </h3>
          <input type="text" id="breed-search-filter" oninput="renderBreedRecords()" placeholder="搜尋魚種..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs w-full sm:w-64">
        </div>
        <div class="overflow-x-auto rounded-xl border border-slate-700">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-slate-900 text-slate-400 border-b border-slate-700">
                <th class="p-3">親魚 A</th>
                <th class="p-3">親魚 B</th>
                <th class="p-3">實測產出</th>
                <th class="p-3 text-center">次數</th>
                <th class="p-3 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="breed-records-table-body" class="divide-y divide-slate-700/50 bg-slate-900/40"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 2: SYNTHESIS -->
    <div id="tab-synth" class="tab-content hidden space-y-6">
      <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 p-5 rounded-2xl border border-cyan-500/30 shadow-2xl space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-black text-white flex items-center gap-2">
            <i class="fa-solid fa-crown text-amber-400"></i> 第一季 15 種賽季魚固定 10 隻魚合成配方
          </h2>
          <span class="text-xs bg-amber-400/10 text-amber-400 border border-amber-400/20 px-3 py-1 rounded-full font-semibold">100% 成功率</span>
        </div>
        <!-- Accordion Container -->
        <div id="season-recipes-container" class="space-y-2 pt-2"></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-7 bg-ocean-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
          <div class="flex justify-between items-center border-b border-slate-700 pb-3">
            <h3 class="text-base font-bold text-cyan-400"><i class="fa-solid fa-cubes"></i> 自訂 10 隻魚合成測試 / 紀錄</h3>
            <button onclick="clearSynthesisPicker()" class="text-xs text-slate-400 hover:text-red-400">重設選擇</button>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5" id="synth-slots-container"></div>
          <div class="bg-slate-900 p-4 rounded-xl border border-cyan-500/40 space-y-3">
            <label class="block text-xs font-bold text-amber-300">實測合成結果：</label>
            <div class="flex gap-2">
              <select id="synth-target-result" class="bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs text-slate-100 flex-1"></select>
              <button onclick="saveSynthesisRecord()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs">儲存配方</button>
            </div>
          </div>
        </div>

        <div class="lg:col-span-5 bg-ocean-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
          <h3 class="text-base font-bold text-amber-400"><i class="fa-solid fa-magnifying-glass"></i> 反向合成配方查詢</h3>
          <select id="synth-reverse-target" onchange="queryReverseSynthesis()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm"></select>
          <div id="synth-reverse-results" class="bg-slate-900 p-4 rounded-xl border border-slate-700 min-h-[200px]">請選擇上方魚種查詢已知配方</div>
        </div>
      </div>
    </div>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white border border-cyan-400 px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 z-50 text-xs flex items-center gap-2">
    <i id="toast-icon" class="fa-solid fa-circle-check text-cyan-400"></i>
    <span id="toast-msg">操作成功</span>
  </div>

  <script>
    // ==========================================
    // 1. 請在此貼上您部署 Google Apps Script 取得的 Web App URL
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxkzwnnEPwrsTtZz6Rs3Y2gTS-Bsk1-ZGk1y6iUa8sx8WqH57_lYZys85oOjqLbNWD99w/exec";

    // 176 隻魚品種定義
    const SPECIES = [
      "陽光雀鯛", "紫羅蘭擬雀鯛", "藍寶石雀鯛", "烈焰扇尾金魚", "霜白太陽魚",
      "櫻桃鯽", "月角雀鯛", "苔背小精靈", "霓虹清潔隆頭魚", "三色錦鯉",
      "火鰭天竺鯛", "睡衣天竺鯛", "潟湖雀鯛", "銅帶蝴蝶魚", "緋紅天竺鯛",
      "星鰭邦加天竺鯛", "黃金蝴蝶魚", "霓虹條紋脂鯉", "稜鏡虹魚", "泡芙河豚",
      "紅頰火焰蝦虎", "金尾神仙魚", "天翼飛魚", "寶石花䲁", "藍電鮪魚",
      "霜藍翻車魚", "珊瑚小丑魚", "黃金海馬", "黃金長鰭雀鯛", "旭日蘭壽",
      "萊姆背海龜", "小藍鯨", "緋冠獅子魚", "紫水晶鬥魚", "祭典章魚"
    ];

    const FISH_DB = [{ id: "000", num: 0, name: "金魚", star: 0, displayName: "#000 金魚" }];
    let currentId = 1;

    SPECIES.forEach(sp => {
      for (let star = 1; star <= 5; star++) {
        const idStr = String(currentId).padStart(3, '0');
        const starStr = '☆'.repeat(star);
        FISH_DB.push({
          id: idStr,
          num: currentId,
          name: `${sp} ${starStr}`,
          star: star,
          displayName: `#${idStr} ${sp} ${starStr}`
        });
        currentId++;
      }
    });

    // 15 種固定賽季魚配方
    const SEASON_RECIPES = [
      { target: "126", materials: ["066","031","031","031","041","041","041","036","036","036"] },
      { target: "127", materials: ["126","032","032","032","042","042","042","037","037","037"] },
      { target: "128", materials: ["127","033","033","033","043","043","043","038","038","038"] },
      { target: "129", materials: ["128","034","034","034","044","044","044","039","039","039"] },
      { target: "130", materials: ["129","035","035","035","045","045","045","040","040","040"] },

      { target: "151", materials: ["101","076","076","076","081","081","081","086","086","086"] },
      { target: "152", materials: ["151","077","077","077","082","082","082","087","087","087"] },
      { target: "153", materials: ["152","078","078","078","083","083","083","088","088","088"] },
      { target: "154", materials: ["153","079","079","079","084","084","084","089","089","089"] },
      { target: "155", materials: ["154","080","080","080","085","085","085","090","090","090"] },

      { target: "171", materials: ["141","096","096","096","111","111","111","106","106","106"] },
      { target: "172", materials: ["171","097","097","097","112","112","112","107","107","107"] },
      { target: "173", materials: ["172","098","098","098","113","113","113","108","108","108"] },
      { target: "174", materials: ["173","099","099","099","114","114","114","109","109","109"] },
      { target: "175", materials: ["174","100","100","100","115","115","115","110","110","110"] }
    ];

    let localBreedRecords = JSON.parse(localStorage.getItem('pcfish_breed_records') || '[]');
    let localSynthRecords = JSON.parse(localStorage.getItem('pcfish_synth_records') || '[]');

    window.addEventListener('DOMContentLoaded', () => {
      renderSlotsUI();
      initDropdowns();
      renderSeasonRecipes();
      calculateBreedPrediction();
      fetchAllRecordsFromGAS(); // 自動嘗試向 Google 試算表同步資料
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('border-cyan-400', 'text-cyan-400', 'bg-slate-800/80');
        btn.classList.add('border-transparent', 'text-slate-400');
      });
      document.getElementById(tabId).classList.remove('hidden');
      const activeNav = document.getElementById('nav-' + tabId.replace('tab-', ''));
      if(activeNav) {
        activeNav.classList.add('border-cyan-400', 'text-cyan-400', 'bg-slate-800/80');
        activeNav.classList.remove('border-transparent', 'text-slate-400');
      }
    }

    function renderSlotsUI() {
      const container = document.getElementById('synth-slots-container');
      let html = '';
      for(let i=1; i<=10; i++){
        html += `<div class="bg-slate-900 p-2 rounded-lg border border-slate-700/70 text-xs">
          <span class="text-[10px] text-cyan-400 font-bold block mb-1">第 ${i} 隻</span>
          <select id="synth-slot-${i}" class="w-full bg-slate-800 border border-slate-600 rounded p-1 text-[11px]"></select>
        </div>`;
      }
      container.innerHTML = html;
    }

    function initDropdowns() {
      const optionsHtml = FISH_DB.map(f => `<option value="${f.id}">${f.displayName}</option>`).join('');
      ['breed-parent-a', 'breed-parent-b', 'breed-actual-child', 'breed-target-fish', 'synth-target-result', 'synth-reverse-target'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.innerHTML = optionsHtml;
      });
      for(let i=1; i<=10; i++){
        const el = document.getElementById(`synth-slot-${i}`);
        if(el) el.innerHTML = optionsHtml;
      }
      document.getElementById('breed-parent-a').addEventListener('change', calculateBreedPrediction);
      document.getElementById('breed-parent-b').addEventListener('change', calculateBreedPrediction);
    }

    function calculateBreedPrediction() {
      const pA = FISH_DB.find(f => f.id === document.getElementById('breed-parent-a').value);
      const pB = FISH_DB.find(f => f.id === document.getElementById('breed-parent-b').value);
      const resContainer = document.getElementById('breed-result-content');
      
      if (!pA || !pB) return;

      if (pA.id === pB.id) {
        resContainer.innerHTML = `<span class="text-cyan-300">同種繁殖 (${pA.name})</span><br><span class="text-xs text-slate-400">主要產出同種類，有機率發生升星突變。</span>`;
      } else {
        resContainer.innerHTML = `<span class="text-amber-300">跨種雜交 (${pA.name} × ${pB.name})</span><br><span class="text-xs text-slate-400">繼承雙親品種，有機率產生新物種。</span>`;
      }
    }

    // 從 GAS 抓取遠端社群資料庫
    function fetchAllRecordsFromGAS() {
      if (!GAS_API_URL || GAS_API_URL.includes("您的_GOOGLE_APPS_SCRIPT_網址")) {
        renderBreedRecords();
        return;
      }

      fetch(GAS_API_URL)
        .then(res => res.json())
        .then(data => {
          if (data.breed) {
            localBreedRecords = data.breed;
            localStorage.setItem('pcfish_breed_records', JSON.stringify(localBreedRecords));
            renderBreedRecords();
          }
          if (data.synth) {
            localSynthRecords = data.synth;
            localStorage.setItem('pcfish_synth_records', JSON.stringify(localSynthRecords));
          }
        })
        .catch(err => {
          console.error("載入試算表資料失敗:", err);
          renderBreedRecords();
        });
    }

    function searchBreedParents() {
      const targetId = document.getElementById('breed-target-fish').value;
      const targetFish = FISH_DB.find(f => f.id === targetId);
      const resContainer = document.getElementById('breed-parent-results');
      const countEl = document.getElementById('breed-parent-count');

      const matches = localBreedRecords.filter(r => r.child === targetId);
      
      if(matches.length === 0) {
        countEl.innerText = "0 組";
        resContainer.innerHTML = `<div class="text-slate-500 text-center py-2">尚未有玩家登錄成功繁殖出 ${targetFish.displayName} 的紀錄</div>`;
      } else {
        countEl.innerText = `${matches.length} 組`;
        resContainer.innerHTML = matches.map(m => {
          const fA = FISH_DB.find(f => f.id === m.pA);
          const fB = FISH_DB.find(f => f.id === m.pB);
          return `<div class="bg-slate-800/80 p-2 rounded border border-slate-700/50 flex justify-between items-center">
            <span>${fA ? fA.displayName : m.pA} + ${fB ? fB.displayName : m.pB}</span>
            <span class="text-amber-400 font-bold">${m.count} 次</span>
          </div>`;
        }).join('');
      }
    }

    function recordBreedExperiment() {
      const parentA = document.getElementById('breed-parent-a').value;
      const parentB = document.getElementById('breed-parent-b').value;
      const child = document.getElementById('breed-actual-child').value;

      const payload = {
        action: "addBreed",
        parentA: parentA,
        parentB: parentB,
        child: child
      };

      showToast("正在上傳紀錄至社群資料庫...");

      if (GAS_API_URL && !GAS_API_URL.includes("您的_GOOGLE_APPS_SCRIPT_網址")) {
        fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(() => {
          showToast("上傳成功！資料已寫入社群試算表");
          setTimeout(fetchAllRecordsFromGAS, 1000);
        }).catch(err => {
          showToast("上傳失敗，已暫存至本地");
        });
      } else {
        const existing = localBreedRecords.find(r => (r.pA === parentA && r.pB === parentB && r.child === child));
        if (existing) { existing.count++; } 
        else { localBreedRecords.push({ pA: parentA, pB: parentB, child: child, count: 1 }); }
        localStorage.setItem('pcfish_breed_records', JSON.stringify(localBreedRecords));
        renderBreedRecords();
        showToast("繁殖紀錄已存檔至在地儲存");
      }
    }

    function renderBreedRecords() {
      const filterText = document.getElementById('breed-search-filter')?.value.toLowerCase() || '';
      const tbody = document.getElementById('breed-records-table-body');
      if(!tbody) return;

      const filtered = localBreedRecords.filter(r => {
        const fA = FISH_DB.find(f => f.id === r.pA);
        const fB = FISH_DB.find(f => f.id === r.pB);
        const fC = FISH_DB.find(f => f.id === r.child);
        return ((fA?.displayName || '') + (fB?.displayName || '') + (fC?.displayName || '')).toLowerCase().includes(filterText);
      });

      if(filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">尚無相關紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((r, idx) => {
        const fA = FISH_DB.find(f => f.id === r.pA);
        const fB = FISH_DB.find(f => f.id === r.pB);
        const fC = FISH_DB.find(f => f.id === r.child);
        return `<tr class="border-b border-slate-800 hover:bg-slate-800/30">
          <td class="p-3">${fA?.displayName || r.pA}</td>
          <td class="p-3">${fB?.displayName || r.pB}</td>
          <td class="p-3 text-cyan-300 font-semibold">${fC?.displayName || r.child}</td>
          <td class="p-3 text-center">${r.count} 次</td>
          <td class="p-3 text-right"><button onclick="deleteBreedRecord(${idx})" class="text-red-400 hover:underline">刪除</button></td>
        </tr>`;
      }).join('');
    }

    function deleteBreedRecord(idx) {
      localBreedRecords.splice(idx, 1);
      localStorage.setItem('pcfish_breed_records', JSON.stringify(localBreedRecords));
      renderBreedRecords();
    }

    function renderSeasonRecipes() {
      const container = document.getElementById('season-recipes-container');
      if(!container) return;

      const sortedRecipes = [...SEASON_RECIPES].sort((a, b) => parseInt(a.target) - parseInt(b.target));

      container.innerHTML = sortedRecipes.map((recipe) => {
        const targetFish = FISH_DB.find(f => f.id === recipe.target);
        const counts = {};
        recipe.materials.forEach(m => { counts[m] = (counts[m] || 0) + 1; });
        const matListStr = Object.entries(counts).map(([mId, qty]) => {
          const f = FISH_DB.find(x => x.id === mId);
          return `<span class="bg-slate-900 border border-slate-700/80 px-2.5 py-1 rounded text-cyan-300 font-medium">${f ? f.displayName : '#' + mId} <span class="text-amber-400 font-bold">×${qty}</span></span>`;
        }).join(' ');

        return `
          <div class="bg-slate-900/80 rounded-xl border border-slate-700/80 overflow-hidden transition-all">
            <button onclick="toggleRecipeAccordion('${recipe.target}')" class="w-full px-4 py-3 text-left flex justify-between items-center bg-slate-800/60 hover:bg-slate-800 transition-colors focus:outline-none">
              <div class="flex items-center space-x-3">
                <span class="bg-amber-400/10 text-amber-400 border border-amber-400/30 px-2.5 py-0.5 rounded text-xs font-bold">#${recipe.target}</span>
                <span class="font-bold text-slate-100 text-sm">${targetFish ? targetFish.displayName : '#' + recipe.target}</span>
              </div>
              <div class="flex items-center space-x-2 text-slate-400 text-xs">
                <span>點擊查看 10 隻配方</span>
                <i id="accordion-icon-${recipe.target}" class="fa-solid fa-chevron-down transition-transform duration-300"></i>
              </div>
            </button>
            <div id="accordion-content-${recipe.target}" class="hidden p-4 border-t border-slate-800 bg-slate-950/60 space-y-2">
              <div class="text-xs text-slate-400 font-medium mb-1">合成所需素材魚 (共 10 隻)：</div>
              <div class="flex flex-wrap gap-2 text-xs">
                ${matListStr}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleRecipeAccordion(targetId) {
      const content = document.getElementById(`accordion-content-${targetId}`);
      const icon = document.getElementById(`accordion-icon-${targetId}`);
      if(content) {
        if(content.classList.contains('hidden')) {
          content.classList.remove('hidden');
          if(icon) icon.classList.add('rotate-180');
        } else {
          content.classList.add('hidden');
          if(icon) icon.classList.remove('rotate-180');
        }
      }
    }

    function clearSynthesisPicker() {
      for(let i=1; i<=10; i++){
        document.getElementById(`synth-slot-${i}`).value = "000";
      }
    }

    function saveSynthesisRecord() {
      const materials = [];
      for(let i=1; i<=10; i++){
        materials.push(document.getElementById(`synth-slot-${i}`).value);
      }
      const targetId = document.getElementById('synth-target-result').value;

      const payload = {
        action: "addSynth",
        targetId: targetId,
        materials: materials
      };

      showToast("正在上傳合成配方至社群資料庫...");

      if (GAS_API_URL && !GAS_API_URL.includes("您的_GOOGLE_APPS_SCRIPT_網址")) {
        fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(() => {
          showToast("儲存成功！合成配方已上傳");
          setTimeout(fetchAllRecordsFromGAS, 1000);
        });
      } else {
        localSynthRecords.push({ targetId, materials });
        localStorage.setItem('pcfish_synth_records', JSON.stringify(localSynthRecords));
        showToast("合成配方已儲存至在地紀錄！");
      }
    }

    function queryReverseSynthesis() {
      const targetId = document.getElementById('synth-reverse-target').value;
      const resContainer = document.getElementById('synth-reverse-results');
      
      const seasonMatch = SEASON_RECIPES.filter(r => r.target === targetId);
      const userMatches = localSynthRecords.filter(r => r.targetId === targetId);

      if(seasonMatch.length === 0 && userMatches.length === 0) {
        resContainer.innerHTML = '<div class="text-xs text-slate-500 text-center py-4">尚無此魚種之 10 隻魚合成配方。</div>';
        return;
      }

      let html = '';
      if(seasonMatch.length > 0) {
        html += `<div class="mb-3"><span class="text-xs font-bold text-amber-400 block mb-1">【官方固定配方】</span>`;
        seasonMatch.forEach(m => {
          const names = m.materials.map(id => FISH_DB.find(f => f.id === id)?.displayName || id);
          html += `<div class="bg-amber-950/30 border border-amber-800/50 p-2 rounded text-xs text-slate-200 mb-1">${names.join('<br>')}</div>`;
        });
        html += `</div>`;
      }

      if(userMatches.length > 0) {
        html += `<div><span class="text-xs font-bold text-cyan-400 block mb-1">【社群實測紀錄】</span>`;
        userMatches.forEach(m => {
          const names = m.materials.map(id => FISH_DB.find(f => f.id === id)?.displayName || id);
          html += `<div class="bg-slate-800 p-2 rounded text-xs text-slate-300 mb-1">${names.join(', ')}</div>`;
        });
        html += `</div>`;
      }

      resContainer.innerHTML = html;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }
  </script>
</body>
</html>
